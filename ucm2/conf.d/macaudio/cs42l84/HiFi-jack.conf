# For a jack-only card: a CS42L84 on PCM 0 and no speakers (J616s: the
# speakers are a card of their own). Like Headphones.conf, but the headset
# preamp control is "Jack ADC Preamp Capture Volume", the name the kernel
# driver registers.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
		cset "name='Jack DACA Select' 'ASP RX CH1'"
		cset "name='Jack DACB Select' 'ASP RX CH2'"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		PlaybackMixerElem "Jack DAC"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Jack ADC WNF Switch' on"
		cset "name='Jack WNF Corner Frequency' 1"
		cset "name='Jack ADC HPF Switch' on"
		cset "name='Jack HPF Corner Frequency' 1"
		# The analog preamp is fixed at +10 dB (1 of 0, +10, +20 dB) and the
		# desktop's input volume drives only the PGA (-12..0 dB): at 100 %
		# a headset microphone then peaks near -15 dBFS for speech. With
		# the preamp in the volume path, PipeWire fills the PGA first and
		# leaves the preamp at 0 dB at any volume up to 100 %.
		cset "name='Jack ADC Preamp Capture Volume' 1"
		cset "name='Jack SDOUT1 Select' 'ADC'"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixerElem "Jack ADC PGA"
		JackControl "Headset Mic Jack"
	}
}
